# Self-Expanding Blueprints' settings for the test harness.
# harness-lib.sh, vdisplay.sh, run-tests.sh, run-gui.sh, gui-drive.sh and
# run-mp.sh are copies of the shared harness; this file is the repo's own
# part. The names are explained in dev/harness-lib.sh.
ABBR=SEB
SETS=(base space-age)
TICKS=12100   # past seb-test's last check tick
TEST_MOD=seb-test
MP_PORT=34297
PRE_TESTS=("python3 tools/check_locale.py")

# The world mods (dev/mods/) of run-gui.sh's client and run-mp.sh's server.
#   SEB_WORLD=<dev mod>   another world for run-gui.sh (record-media.sh uses seb-media-world)
GUI_WORLD="${SEB_WORLD:-seb-gui-world}"
MP_WORLD=seb-mp-world

# The names this repo's own scripts took before it moved to the shared
# harness still work: SEB_SIZE and SEB_UI_SCALE (run-gui.sh), SEB_TEST_TICKS,
# SEB_TEST_ARG and SEB_RUN_DIR (run-tests.sh).
GUI_SIZE="${GUI_SIZE:-${SEB_SIZE:-1600x900}}"
GUI_UI_SCALE="${GUI_UI_SCALE:-${SEB_UI_SCALE:-}}"
HARNESS_TICKS="${HARNESS_TICKS:-${SEB_TEST_TICKS:-$TICKS}}"
HARNESS_ARG="${HARNESS_ARG:-${SEB_TEST_ARG:-}}"
HARNESS_RUN="${HARNESS_RUN:-${SEB_RUN_DIR:-$REPO/.run/tests}}"
