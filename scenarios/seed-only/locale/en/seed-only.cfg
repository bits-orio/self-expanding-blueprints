scenario-name=Seed only (Self-Expanding Blueprints)
description=You have no hands: no character, nothing to place yourself. A small robot network and a chest of materials stand at the start, with one design ready. Grow a factory from designs alone, with the Self-Expanding Blueprints window (__CONTROL__seb-toggle-window__). The goal: 400 solar panels standing.

