locate=Show on the map.\nLeft-click: where it is growing now.\nRight-click: all of it.
pause=Pause
resume=Resume
retry-none=No blocked spots to try again. Spots stopped by something that can go away (a building, tree or rock, a cliff, water, a probe, enemies, uncharted land) show a red mark on the map, and this button tries them again.
retry-project=Try the __1__ blocked __plural_for_parameter__1__{1=spot|rest=spots}__ (red marks on the map) again, now that what stood there may be gone. They are also tried again on their own when something there is mined or destroyed, landfilled or charted. Shift + right-drag the area tool over marks to try only those.
stop=Stop growing and take it off this list. Copies already placed stay, and robots finish the ones under construction.
draw=Draw:
draw-tooltip=Markers you place in your build before you blueprint it. They tell the mod how copies attach and when they grow. Robots never build them.
give-probe=[img=item/seb-probe] Probe
give-probe-tooltip=Take probes (optional). A probe says what must be true on its tile before a copy is built there: ore under it (any, or the resources you set as signals), water, one of your buildings, a sense signal's kind (ghosts, trees...), or with the "deny" signal the opposite.
builder-idle=Waiting for a request.
builder-working=Working on request __2__ (__1__).
builder-answered=Answered request __2__ (__1__).
builder-over-limit=Your team already has __1__ blueprint builders at work, the most this map allows. This one takes no requests until one of them goes.
builder-intro=Put a request on its input, red or green: a verb signal whose value is a request number, with its inputs. It answers on its output: Request accepted with the same number, then Request done, or Request failed with an error signal saying why. Drop the request once it is accepted and send the next one with a new number. X and Y count tiles from the builder unless Absolute is set.
builder-verbs=Verbs
builder-inputs=Inputs
builder-outputs=Outputs
builder-stamp=One copy of a design at X, Y, turned by R quarter turns. Done once robots have built it; the copy number comes with it.
builder-grow=Grow a design from X, Y, as the window's Grow button does. Done when growth finishes; meanwhile the output shows ghosts left, open and blocked sockets, copies built and the next copy's materials.
builder-remove=Remove the copy with this copy number, exactly as a right-drag would.
builder-clear=Deconstruct everything of yours in the rectangle X, Y, W, H, trees and rocks included. Item signals narrow it to what those items build.
builder-sense=Count one thing in the rectangle X, Y, W, H: buildings, ghosts, resources, trees and rocks, water or enemies.
builder-design=Which design, by its number (in the design's picture card). Without it: the design whose icon is a signal on the input. Capture answers with the new design's number here.
builder-xy=Where, in tiles from the builder (X east, Y south).
builder-wh=The rectangle's width and height.
builder-rotation=Quarter turns clockwise.
builder-absolute=X and Y are map coordinates.
builder-superforce=With Stamp or Grow: your buildings in the way are marked for removal instead of refusing the spot (with Grow, those of the copy a copy grows from too), and a copy on water, lava or space is built on the floor it needs once your team can make it.
builder-instance=The copy to remove, read or write. Stamp answers with the copy it made here (the first, for a grid).
builder-count=Growth stops after this many copies.
builder-sides=The sides a plain design grows toward (default east and south).
builder-pause=While it is on the input, the builder's growth is paused.
builder-stop=Ends the request that is running: growth stops and answers done; any other request answers Error: stopped, and what it started (ghosts, orders) stays with the robots.
builder-ack=The request number, once the request is accepted.
builder-done=The request number, once the work is done.
builder-error=The request number, with one error signal saying why.
builder-ghosts-left=While Stamp or Grow runs: what robots still have to build.
builder-sockets=While Grow runs: spots still to try, and spots refused (water, cliffs, buildings and the like).
builder-built=Copies built: with Grow, so far; with Stamp, at Request done. While Grow runs the output also shows the next copy's materials as item signals.
builder-sense-what=What Sense counts (one per request)
builder-sense-entities=Your buildings there, as the items that place them.
builder-sense-ghosts=Your ghosts there, as the items that place them.
builder-sense-resources=Resources there, as what they yield, by amount.
builder-sense-count=How many there are, on this signal.
builder-errors=Errors (one comes with Request failed)
give-port=[img=item/seb-port] Port
give-port-tooltip=Take ports (optional, for circuits). Place one on a combinator of your build: a blueprint builder can then read and write that combinator in every copy, by the copy's number.
give-clear=[img=item/seb-keep-clear] Keep clear
give-clear-tooltip=Take the Keep clear tool (optional). Click a tile, or drag over an area, that your build needs empty, inside it or past its edge; right-click or right-drag takes marks off. Tiles under your buildings are skipped. Draw the marks into the design: copies keep off those tiles, trees and rocks there are cleared, and a building there stops the copy.
builder-find=The nearest spot within Radius of X, Y where the design fits (every check a stamp makes passes); done with that spot in X and Y.
builder-capture=Make a new design from everything of yours in the rectangle X, Y, W, H (at most 64 x 64 tiles); done with its number in Design.
builder-upgrade=Upgrade everything of yours in the rectangle X, Y, W, H to its next tier; item signals narrow it.
builder-read=Show what is on the port of the copy with this copy number.
builder-write=Put the data signals on the input (everything but the request's own signals) into the port of the copy with this copy number (a constant combinator).
builder-grid=Stamp a grid of copies, Grid X across and Grid Y down (at most 16 each), Spacing tiles apart (at most 1000).
builder-radius=How far Find searches, in tiles (at most 64; default 16).
builder-cancel=With Clear or Upgrade: cancel those orders in the rectangle instead of placing them.
add-book-too-big=This book is too big to add: it holds more than __1__ blueprints and books

