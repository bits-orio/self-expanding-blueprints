[mod-setting-description]
seb-max-projects-per-force=How many growing or paused projects one team may have at once. Plans have their own limit. 0: no limit.
seb-max-building-per-force=How many copies one team may have under construction at once: its projects' copies and the ones its blueprint builders stamp, all together. 0: no limit.
seb-max-plans-per-force=How many plans one team keeps at once. A new plan past this replaces the team's oldest one. 0: no limit.
seb-max-designs-per-force=How many designs one team may register. A team never keeps more than 30,000. 0: 30,000.
seb-max-design-parts=How many parts one design may have: every entity of the blueprint, markers included, and every floor tile. Registering a design takes about 35 µs per part in a single tick, so this also caps that pause. It applies when a design or a new version is registered: designs already registered keep working. 0: no limit.
seb-max-builders-per-force=How many blueprint builders of one team take requests. Builders past this stay idle. 0: no limit.
seb-builders-charted-only=Blueprint builders stamp, grow and search only on land their team has charted, as the grow window does. Off: also on land the game has generated but the team has not charted. Builders never make the game generate new map either way.
seb-work-per-force=How much of each tick one team's growth, plans, builders and new designs may use, on average. A team that asks for more waits its turn, and the other teams carry on. One big piece of work is charged after it has run, so it can still make a tick long. 500 µs is 3% of a tick. 0: no limit.
seb-work-per-tick=How much of each tick the mod may use on the whole server, all teams together: their growth, plans, builders and new designs. Teams take it in turns, each within its own share. The work runs every sixth tick, so that tick can take about six times this (24 ms at the default), plus the piece of work that uses up what is left. 4000 µs is a quarter of a tick. 0: no limit.
seb-idle-robot-share=Growth places the next copy only while at least this share of the network's construction robots is idle, so a team's own building keeps robots. 0: off.
seb-agent-write-tools=With AI Agent Bridge: an agent asked in chat may pause, resume and stop a team's growth projects and start new ones, for the team the bridge names. The bridge passes along a team the agent itself names, so a player can talk an agent into acting for another team: turn this on only where players trust each other. Off: it can only read them.

