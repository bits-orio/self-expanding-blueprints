[mod-name]
self-expanding-blueprints=Self-Expanding Blueprints

[mod-description]
self-expanding-blueprints=Grow a self-expanding factory from your own blueprints. Draw arrows where the next piece attaches and robots keep building until water, cliffs or your rules stop them. Every copy reports when it is done and can be updated or removed exactly. Circuits drive it all through the blueprint builder.

[item-name]
seb-grow-tool=Grow area tool
seb-keep-clear-tool=Keep clear tool
seb-sensor-tool=Ore sensor tool
seb-grow-blueprint=Design to grow
seb-grow-frame=Grow frame
seb-socket=Socket arrow
seb-entry=Plug arrow
seb-sensor=Ore sensor
seb-probe=Probe
seb-builder=Blueprint builder
seb-port=Port
seb-keep-clear=Keep clear

[item-description]
seb-grow-tool=[font=default-bold]Drag[/font]: fill the rectangle with copies, from the corner you start at\n[font=default-bold]Click[/font]: grow from here\n[font=default-bold]Right-drag[/font]: remove the copies the drag touches, exactly what each built\n[font=default-bold]Shift + right-drag[/font]: try the blocked spots (red marks) under the drag again
seb-keep-clear-tool=[font=default-bold]Click[/font]: mark the tile Keep clear\n[font=default-bold]Drag[/font]: mark every tile of the rectangle\n[font=default-bold]Right-drag[/font]: take the marks off\nTiles under your buildings are skipped. Draw the marks into a design: every copy keeps those tiles empty.
seb-sensor-tool=[font=default-bold]Click[/font]: put an ore sensor on the tile\n[font=default-bold]Drag[/font]: put one on every tile of the rectangle\n[font=default-bold]Right-click or right-drag[/font]: take them off\nOn a drill a sensor watches the drill's whole mining area.
seb-socket=Marks where the next copy goes. Place it on the first tile outside your build, pointing away from it: the next copy is built on that tile, facing that way.\nThe next copy is the same design, unless the arrow's description names another design (open the arrow to write it).
seb-entry=Optional. Marks which tile of this design goes onto a socket. Place it on your build's own edge, pointing into it: when a copy is built at a socket, this tile lands on the socket.\nWithout a plug, a copy attaches by the middle of its back edge. One plug per design.
seb-sensor=Makes copies wait for ore to run out before they grow on. A copy of a design with a sensor opens its sockets only once no ore is left where the sensor looks.\nOn a mining drill it watches the drill's whole mining area. Set the signal R in it to watch a square 2R + 1 tiles wide around it instead (R = 1: 3 × 3). Anywhere else it watches its own tile.
seb-probe=Says what must be true on its tile before a copy is built there. With no signal set: some ore under it. Set resource signals (iron ore, crude oil...) to ask for one of those, the water signal to ask for water, and add the "deny" signal to ask for the opposite.
seb-builder=Stamps and grows designs, removes copies, clears and senses areas, on circuit requests. Open it for the list of signals.
seb-port=Marks a combinator of the design as each copy's circuit mailbox. A blueprint builder reads it (Read) and writes it (Write, a constant combinator) by the copy's number. Place it on top of the combinator.
seb-keep-clear=Marks a tile your build needs empty: a walkway, train clearance, a gap between copies. Copies keep off it, trees and rocks on it are cleared, and a building on it stops the copy (or is removed, with "Replace buildings in the way").

