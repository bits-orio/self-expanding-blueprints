retire-depleted-tooltip=When none of a copy's mining drills has anything left to mine, robots remove the copy, exactly as a right-drag would.
fast-fill=Fast fill (do not wait for each copy to be built)
fast-fill-tooltip=Each copy opens the spots around it as soon as it is placed, and up to 8 copies are built at once. Fills large areas quickly; ore sensors still wait for their ore.
dry-run=Plan only (outlines, nothing is built)
dry-run-tooltip=Lays out the whole plan as outlines on the map, with the same checks as real growth, before any ghost exists. When it looks right, press the green check on its row to grow it for real.
preview-ghosts=Show the first
preview-ghosts-after=copies as ghosts
preview-ghosts-tooltip=With "Plan only": the plan's first copies (up to 20) are pasted as ghosts too, so you see the buildings and not just outlines. They are only there to look at: pasted normally (nothing in the way is cleared), never built by robots, and gone when you grow the plan or stop it.
superforce=Replace buildings in the way
superforce-tooltip=Superforce: where your own buildings stand in a copy's way, they are marked for removal and the copy is built anyway, like a Ctrl + Shift paste. The copy it grows from counts too, so a design can grow over its last copy: one blueprint can creep along its ore, laying its belts where the last drill stood. A copy on water, lava or space is built on the floor it needs (landfill, foundation, ice platform) once your team can make it, and growth waits for that floor like any material. Without it such spots are skipped. Trees and rocks are always cleared. Plans count the same spots.
build-plan=Grow this plan for real.
copies=Copies that need a look: building, stalled, incomplete, waiting for ore or of an older version, with locate, update and remove.
update-project=Update the copies of this project to the design's newest version, in place: shared parts stay, new parts come as ghosts, dropped parts are removed.
grow=Grow
grow-tooltip=Takes the design in hand: its ghosts follow the pointer inside a dashed frame. Click where the first copy should go and it grows from there; the design stays in your hand, so each click starts another project (Q puts it away). Turn it (R) or flip it as you would any blueprint: the copies, and the directions it grows toward, turn and flip with it.
world-directions=Keep the directions to the world
world-directions-tooltip=Grow toward these sides of the world (north up) however you turn or flip the design in hand. Unticked, the directions turn and flip with it.
