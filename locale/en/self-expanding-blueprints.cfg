add-tooltip=Saves the blueprint you are holding as a design you can grow. A blueprint with the name of an existing design becomes that design's next version.
add-nothing-tooltip=Pick up a blueprint first, from your inventory or from the blueprint library, then press this.
give-socket=[img=item/seb-socket] Socket
give-socket-tooltip=Take socket arrows to draw into a build. Place one on the first tile outside it, pointing away from it, where the next copy should go.
give-entry=[img=item/seb-entry] Plug
give-entry-tooltip=Take plug arrows (optional). Place one on the build's own edge, pointing in: that tile of every new copy goes onto the socket. Several plugs? Number them with a signal value, and number the sockets to match.
give-sensor=[img=item/seb-sensor] Ore sensor
give-sensor-tooltip=Take the Ore sensor tool (optional, for mining). Click a tile for one sensor, or drag over an area for one on every tile; right-click or right-drag takes them off. A copy of a design with sensors grows on only once the ore under them has run out. On a drill a sensor watches the drill's whole area; the signal R in it watches a smaller or larger square.
help=How growing works
help-plain=Without arrows, a design repeats edge to edge toward the sides you tick under Grow.
help-socket=[img=item/seb-socket] [font=default-bold]Socket[/font]: place it on the first tile outside your build, pointing away from it. The next copy is built there.
help-plug=[img=item/seb-entry] [font=default-bold]Plug[/font] (optional): place it on your build's own edge, pointing in. That tile of the next copy goes onto the socket. A design may have several plugs: give each a number (any signal set in it, its value is the number) and a socket with the same number uses that plug; a socket without one uses the plug without one.
help-target=To grow a different design at a socket, open the socket and write that design's name in its description. Write a labelled book's name instead, after adding the book, and the first of its designs that fits is built.
help-tooltip=How growing works: a window with a picture for every marker. Drag it aside and keep it open while you draw.
help-tab-sockets=Sockets and plugs
help-tab-sensor=Ore sensor
help-tab-probe=Probe
help-tab-port=Port
help-sensor-what=[img=item/seb-sensor] [font=default-bold]Ore sensor[/font] (for mining): a finished copy opens its sockets only once no ore is left where its sensor looks, so the next outpost comes when this one is mined out.
help-sensor-where=Put it on a drill and it watches the drill's whole mining area. Anywhere else it watches its own tile.
help-sensor-radius=For another square, open the sensor and set signal R: 0 watches its own tile, 1 a 3 × 3 square, 2 a 5 × 5 square, and so on. With several sensors, every one must run dry.
help-sensor-retire=Tick "Remove copies whose ore runs out" under More options, and copies whose drills have nothing left to mine are removed as well.
help-probe-what=[img=item/seb-probe] [font=default-bold]Probe[/font]: a check on the ground under it. A copy is built only where every probe in its design holds; where one fails, that spot is skipped.
help-probe-rules=Open the probe and set what it asks for:\n  • no signal: some ore under it\n  • an ore, item or fluid signal (iron ore, copper plate, crude oil): a resource that gives it\n  • the water signal: a water tile\n  • a building's item (a pole, a chest): that building of your team\n  • a sense signal from the blueprint builder (buildings, ghosts, ore, trees and rocks, water, enemies): only that kind, the other signals then saying which (ghosts and a pole: a ghost of a pole)\n  • add the red "deny" signal for the opposite: no ore, or not water
help-probe-examples=Examples: a probe under a drill keeps outposts on the ore patch; a water probe on the tile in front of an offshore pump follows the shore; a "deny" probe keeps a solar field off ore.
help-probe-pools=In a pool (a labelled book that a socket names), give each design its own probes: the first design whose probes hold is built, such as a different outpost for each ore.
help-port-what=[img=item/seb-port] [font=default-bold]Port[/font] (for circuits): put it on a constant combinator in your build, and that combinator becomes each copy's own mailbox, found by the copy's number.
help-port-how=A blueprint builder's Write request puts signals into one copy's port; Read shows what it holds. Wire the port combinator inside your build to whatever should follow it, such as an assembler's recipe or a train stop's limit.
help-port-numbers=A builder's Stamp answers with the new copy's number, and the copies panel lists them. Open a builder for every signal it understands.
help-tab-clear=Keep clear
help-clear-what=[img=item/seb-keep-clear] [font=default-bold]Keep clear[/font]: mark the tiles your build needs empty, inside the build or past its edge: a walkway, room for a train, a gap between copies. Click a tile or drag over an area with the Keep clear tool; right-click or right-drag takes marks off. Tiles under your buildings are skipped.
help-clear-how=When a copy is placed, trees and rocks on those tiles are cleared. A building on one stops the copy there; with "Replace buildings in the way" (under More options) your own building is removed instead.
help-clear-footprint=The tiles count as part of the copy, so other copies keep off them: a column of Keep clear on one side leaves a free lane between copies.
help-clear-negative-space=Using Negative Space? Its markers in a design work as Keep clear here; its automatic ones around belts and pipes are left out.
help-markers=Take markers from the Draw row on the Designs page of the main window, place them in your build, then blueprint the build with them. Ore sensor and Keep clear give a tool: click a tile, or drag over an area, and right-click or right-drag takes marks off. Robots never build markers.
help-live=[img=utility/tip_icon] Watch it run
help-live-tooltip=Puts a link to its Tips and Tricks entry in your chat: click the link there to open it and watch a live example.
no-designs=No designs yet. Hold a blueprint and press the button above to add it. New to this? The [img=utility/questionmark] button shows how growing works.
select-design=Click to open this design: grow it and see its projects.
no-picture=No picture
