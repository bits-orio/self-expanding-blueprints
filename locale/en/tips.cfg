[tips-and-tricks-item-description]
seb-grow=Press __CONTROL__seb-toggle-window__ or the shortcut button, add the blueprint in your hand as a design, click its name to open its page and press Grow. The design comes into your hand: click where the first copy should go, and robots build copy after copy from there until water, cliffs, buildings or your count stop them. Stop after starts at 4 copies; here it is left empty, which means no limit. The design's page lists each project and says why it waits or stopped.
seb-grow-sides=Each copy adds the next ones on the sides ticked under Grow toward. Here, east alone with Stop after 5 makes the row, and all four sides with Stop after 13 spread out around the click. Turn or flip the design in your hand and the sides turn with it, unless Keep the directions to the world is ticked.
seb-grow-area=Press Fill an area, then drag a rectangle: copies start in the corner where the drag began and spread toward where you let go, and never leave the rectangle, so a strip too narrow for another copy stays empty. Here the drag starts at the top left. The sides ticked under Grow toward do not apply to a drag.
seb-grow-obstacles=A copy goes down whole or not at all. Trees and rocks in its way are cleared; water, a cliff or one of your buildings closes that spot, and a red cross on the map says why.
seb-superforce=Under More options, tick Replace buildings in the way, and your own buildings in a copy's way are marked for removal so the copy is built anyway, like a Ctrl + Shift paste. Without it, those spots are skipped, as in the top area here.
seb-grow-waiting=With Wait for materials ticked (the default), the next copy waits until the construction network holds everything it costs, and growth carries on once the items arrive. A spot no robots reach waits on its own and is tried again every ten seconds.
seb-grow-remove=Take the area tool with Fill an area, then right-drag over copies to remove them. Robots take away exactly what each copy built, and nothing next to it.
seb-sockets=Draw a [img=item/seb-socket] socket on the first tile outside your build, pointing away from it: the next copy is built there, facing that way. A [img=item/seb-entry] plug on the build's own edge, pointing in, picks which tile of the next copy lands on the socket. Here the socket is one row below the plug, so every copy steps down a row.
seb-sockets-turn=A socket that points a quarter turn away from the plug turns the next copy a quarter turn. Four turns bring the belt back to where it started and close it into a ring.
seb-sockets-named=Write another design's name in a socket's description, and that design is built there instead. Here the panels' socket names the accumulators and theirs names the panels, so the two take turns.
seb-pools=Add a labelled blueprint book and it becomes a pool. A socket that names the book tries its designs in order and builds the first that fits. Here the book holds a block, a strip, a slab and a single, biggest first, so smaller pieces finish the edges and the corner of the field.
seb-probes=A [img=item/seb-probe] probe checks the ground under it before a copy is built: some ore, the ores its signals name, water, or with the deny signal the opposite. Where a probe does not hold, that spot is skipped, so deny probes keep a solar field off the ore.
seb-keep-clear=In the Draw row, press [img=item/seb-keep-clear] Keep clear, then click each tile your build needs empty, inside it or past its edge, or drag over an area. Right-click or right-drag takes marks off. Other copies keep off marked tiles, so here the column leaves a free lane. Trees and rocks on them are cleared when a copy is placed. A building there stops the copy, with a red cross on the map; under More options, tick Replace buildings in the way and your own building is removed instead. Negative Space's markers count as Keep clear too, except its automatic ones.
seb-mining=An [img=item/seb-sensor] ore sensor makes copies wait for their ore: a copy grows on only once no ore is left where its sensor looks, so the next outpost comes when this one is mined out. On a drill it watches the drill's whole area; set its signal R to watch a square 2R + 1 tiles wide instead.
seb-mining-remove=Under More options, tick "Remove copies whose ore runs out", and robots take a copy away once its drills have nothing left to mine. With an ore sensor on it, the outpost moves along the ore and leaves nothing behind.
seb-plans=Under More options, tick Plan only to lay a project out as outlines first: every check runs, but nothing is built. To see the buildings too, show its first few copies as look-only ghosts. Press the green check on its row to grow it for real.
seb-fast-fill=Under More options, tick Fast fill, and each copy opens the spots around it as soon as it is placed, with up to eight built at once. Large areas fill much sooner.
seb-updates=Add a changed blueprint under a design's name to make its next version, then open the design and press the update button on its project: older copies change in place, keeping shared parts, building new ones and removing dropped ones. Name a research on a design, and its copies update when your team finishes it.
seb-builder=The [img=item/seb-builder] blueprint builder takes requests on its input: a verb signal such as Grow, whose value is a request number, with its inputs. It answers Request accepted, then Request done or Request failed; open a builder for every signal it understands.
seb-builder-grid=Stamp places copies at once instead of growing them. With Grid columns and Grid rows, one request stamps a whole grid, Grid spacing tiles apart, and answers Request done once robots have built every copy.
seb-ports=Put a [img=item/seb-port] port on a constant combinator in your build, and that combinator becomes each copy's mailbox. A builder's Write request fills one copy's port, found by its copy number, so each copy can be set up differently.

